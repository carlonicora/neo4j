name: neo4j
networks:
  coolify:
    external: true

services:
  certs-dumper:
    image: docker:27-cli
    labels:
      - "traefik.enable=false"
    volumes:
      - ${TRAEFIK_PROXY_DIR:-./neo4j/ssl}:/traefik:ro
      - ./neo4j/ssl:/output
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOMAIN=${SERVICE_FQDN_NEO4J:-localhost}
    healthcheck:
      test: ["CMD", "test", "-f", "/output/privatekey.pem", "-a", "-f", "/output/certificate.pem"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 30s
    command:
      - sh
      - -c
      - |
        apk add --no-cache jq openssl

        extract_certs() {
          if [ -f /traefik/acme.json ]; then
            CERT=$(jq -r ".letsencrypt.Certificates[] | select(.domain.main==\"$$DOMAIN\") | .certificate" /traefik/acme.json 2>/dev/null)
            KEY=$(jq -r ".letsencrypt.Certificates[] | select(.domain.main==\"$$DOMAIN\") | .key" /traefik/acme.json 2>/dev/null)
            if [ -n "$$CERT" ] && [ "$$CERT" != "null" ] && [ -n "$$KEY" ] && [ "$$KEY" != "null" ]; then
              echo "$$CERT" | base64 -d > /output/certificate.pem
              echo "$$KEY" | base64 -d > /output/privatekey.pem
              chmod 644 /output/certificate.pem /output/privatekey.pem
              echo "Let's Encrypt certificates extracted for $$DOMAIN"
              return 0
            fi
          fi
          return 1
        }

        # Try to extract real certs first; fall back to self-signed placeholder
        if ! extract_certs; then
          if [ ! -f /output/privatekey.pem ] || [ ! -f /output/certificate.pem ]; then
            echo "No Let's Encrypt cert yet. Generating self-signed placeholder..."
            openssl req -x509 -newkey rsa:2048 -keyout /output/privatekey.pem -out /output/certificate.pem \
              -days 1 -nodes -subj "/CN=$$DOMAIN"
            chmod 644 /output/certificate.pem /output/privatekey.pem
          fi
        fi

        # Monitor for cert changes and restart Neo4j when they update
        PREV_HASH=$(md5sum /output/certificate.pem 2>/dev/null | cut -d' ' -f1)
        while true; do
          sleep 300
          if extract_certs; then
            NEW_HASH=$(md5sum /output/certificate.pem | cut -d' ' -f1)
            if [ "$$PREV_HASH" != "$$NEW_HASH" ]; then
              echo "Certificate changed — restarting Neo4j to pick up new cert..."
              NEO4J_CONTAINER=$$(docker ps --format '{{.Names}}' | grep neo4j | grep -v backup | grep -v certs | head -1)
              if [ -n "$$NEO4J_CONTAINER" ]; then
                docker restart "$$NEO4J_CONTAINER" 2>/dev/null || true
              fi
              PREV_HASH="$$NEW_HASH"
            fi
          fi
        done
    restart: always

  neo4j:
    depends_on:
      certs-dumper:
        condition: service_healthy
    mem_limit: 6g
    memswap_limit: 7g
    networks:
      - coolify
    ports:
      # 7474 not exposed - access only via Traefik HTTPS
      - 7687:7687
    # Routing and TLS labels are managed by Coolify — do not add them here.
    # Only the port label is needed since Coolify doesn't set it.
    labels:
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
      - ./neo4j/ssl:/ssl:ro
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      # TLS for Bolt using Let's Encrypt certificate
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/ssl
      - NEO4J_dbms_ssl_policy_bolt_private__key=privatekey.pem
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=certificate.pem
      - NEO4J_dbms_connector_bolt_tls__level=OPTIONAL
      - NEO4J_dbms_ssl_policy_bolt_client__auth=NONE
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=1536m
      - NEO4J_server_memory_pagecache_size=1g
      - NEO4J_server_memory_off__heap_max__size=256m
    image: graphstack/dozerdb:5.26.3.0
    restart: always

  neo4j-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - ./neo4j/data:/data:ro
      - ./data-backup:/backups
    environment:
      - COMPOSE_PROJECT=neo4j
      - NEO4J_SERVICE=neo4j
      - BACKUP_NEO4J_CONTAINER=${BACKUP_NEO4J_CONTAINER:-}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-}
      - HOST_BACKUP_DIR=${HOST_BACKUP_DIR:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: always
