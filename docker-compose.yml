name: neo4j
networks:
  coolify:
    external: true

services:
  certs-dumper:
    image: alpine:latest
    labels:
      - "traefik.enable=false"
    volumes:
      - /data/coolify/proxy:/traefik:ro
      - ./neo4j/ssl:/output
    environment:
      - DOMAIN=${SERVICE_FQDN_NEO4J:-localhost}
    command:
      - sh
      - -c
      - |
        apk add --no-cache jq
        while true; do
          if [ -f /traefik/acme.json ]; then
            jq -r ".letsencrypt.Certificates[] | select(.domain.main==\"$$DOMAIN\") | .certificate" /traefik/acme.json | base64 -d > /output/certificate.pem
            jq -r ".letsencrypt.Certificates[] | select(.domain.main==\"$$DOMAIN\") | .key" /traefik/acme.json | base64 -d > /output/privatekey.pem
            echo "Certificates extracted for $$DOMAIN"
          fi
          sleep 3600
        done
    restart: always

  neo4j:
    depends_on:
      - certs-dumper
    networks:
      - coolify
    ports:
      # 7474 not exposed - access only via Traefik HTTPS
      - 7687:7687
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`${SERVICE_FQDN_NEO4J:-localhost}`)"
      - "traefik.http.routers.neo4j.entrypoints=https"
      - "traefik.http.routers.neo4j.tls=true"
      - "traefik.http.routers.neo4j.tls.certresolver=letsencrypt"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
      - ./neo4j/ssl:/ssl:ro
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      # TLS for Bolt using Let's Encrypt certificate
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/ssl
      - NEO4J_dbms_ssl_policy_bolt_private__key=privatekey.pem
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=certificate.pem
      - NEO4J_dbms_connector_bolt_tls__level=OPTIONAL
      - NEO4J_dbms_ssl_policy_bolt_client__auth=NONE
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=1536m
      - NEO4J_server_memory_pagecache_size=1g
      - NEO4J_server_memory_off__heap_max__size=256m
    image: graphstack/dozerdb:5.26.3.0
    restart: always
